server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        # A WebGL build of the engine runs in a page of another origin, and it sends the
        # Authorization header, so the browser asks for permission first (CORS).
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Range" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri =404;
    }
}
