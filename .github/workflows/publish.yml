# Builds the Docker image from the zip of a release and publishes it in ghcr.io.
name: Publish the Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release to build the image from
        required: true

permissions:
  contents: read
  packages: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the zip of the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --pattern sample-assets.zip

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.TAG }}
